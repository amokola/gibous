services:
  - type: web
    name: gibous
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gibous-db
          property: connectionString
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: ALLOW_IN_MEMORY_DATABASE
        value: "false"
      - key: ALLOW_UNSIGNED_AUTH
        value: "false"
      - key: E2E_TEST_MODE
        value: "false"
      - key: WS_RECONNECT_SECRET
        generateValue: true
      - key: WS_MAX_TOTAL_CONNECTIONS
        value: "25"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: gibous_bot
      - key: PUBLIC_APP_URL
        sync: false
      - key: VITE_TON_ASSET_MODE
        value: native_ton
      - key: VITE_TON_NETWORK
        value: mainnet
      - key: TON_ASSET_MODE
        value: native_ton
      - key: TON_NETWORK
        value: mainnet
      - key: TON_DEPOSIT_ADDRESS
        sync: false
      - key: VITE_SYSTEM_DEPOSIT_ADDRESS
        sync: false
      - key: TONCENTER_API_URL
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: PAYOUT_NETWORK
        value: mainnet
      - key: PAYOUT_WORKER_ENABLED
        value: "false"
      - key: PAYOUT_SIGNER_MNEMONIC
        sync: false
      - key: PAYOUT_WALLET_ADDRESS
        sync: false
      - key: PAYOUT_TRANSACTION_ENCRYPTION_KEY
        sync: false
      - key: PAYOUT_MIN_WITHDRAWAL_NANO
        sync: false
      - key: PAYOUT_MAX_WITHDRAWAL_NANO
        sync: false
      - key: PAYOUT_USER_DAILY_LIMIT_NANO
        sync: false
      - key: PAYOUT_GLOBAL_DAILY_LIMIT_NANO
        sync: false
      - key: PAYOUT_WALLET_RESERVE_NANO
        sync: false

databases:
  - name: gibous-db
    databaseName: gibous
    plan: free
    region: frankfurt
