services:
  - type: web
    name: gibous
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gibous-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: ALLOW_IN_MEMORY_DATABASE
        value: "false"
      - key: ALLOW_UNSIGNED_AUTH
        value: "false"
      - key: E2E_TEST_MODE
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: gibous_bot
      - key: PUBLIC_APP_URL
        sync: false
      - key: VITE_TON_ASSET_MODE
        value: native_ton
      - key: VITE_TON_NETWORK
        value: mainnet
      - key: TON_ASSET_MODE
        value: native_ton
      - key: TON_NETWORK
        value: mainnet
      - key: TON_DEPOSIT_ADDRESS
        sync: false
      - key: VITE_SYSTEM_DEPOSIT_ADDRESS
        sync: false

databases:
  - name: gibous-db
    databaseName: gibous
    plan: free
    region: frankfurt
